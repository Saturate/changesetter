[package]
name = "changesetter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Polyglot changeset management CLI"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3.27.0"
