name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Check changeset
        id: check
        run: ./target/release/changesetter check --base origin/${{ github.event.pull_request.base.ref }}
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        # Fork PRs get a read-only token, so the comment can't be posted
        # there; the check step above is what decides pass or fail.
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const marker = '<!-- changesetter-check -->';
            const outcome = process.env.CHECK_OUTCOME;

            // "skipped" means an earlier step (the build) failed, which says
            // nothing about whether the PR has a changeset.
            let body;
            if (outcome === 'success') {
              body = `${marker}\n### Changeset Check: Passed\n\nThis PR includes a changeset.`;
            } else if (outcome === 'failure') {
              body = `${marker}\n### Changeset Check: Missing\n\nNo changeset found. Run \`changesetter add\` to create one.`;
            } else {
              body = `${marker}\n### Changeset Check: Not run\n\nThe check couldn't run; see the workflow logs.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
