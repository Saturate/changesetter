name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Check changeset
        run: ./target/release/changesetter check --base origin/${{ github.event.pull_request.base.ref }}
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHECK_EXIT_CODE: ${{ steps.check.outcome == 'success' && '0' || '1' }}
        with:
          script: |
            const marker = '<!-- changesetter-check -->';
            const passed = process.env.CHECK_EXIT_CODE === '0';

            let body;
            if (passed) {
              body = `${marker}\n### Changeset Check: Passed\n\nThis PR includes a changeset.`;
            } else {
              body = `${marker}\n### Changeset Check: Missing\n\nNo changeset found. Run \`changesetter add\` to create one.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
