name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # --locked: a Cargo.lock that doesn't match Cargo.toml makes the release
      # job and `cargo publish` fail on a dirty tree, so catch it here.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The version-PR flow only really runs after a version PR merges, so run
  # its steps here against scratch repos with a stubbed gh.
  release-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Version-PR flow of actions/release
        run: tests/actions/release-version-pr.sh target/release/changesetter

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      # actionlint only reads .github/workflows; the composite actions ship
      # their own scripts, which run on every consumer's runner.
      - name: shellcheck action scripts
        run: shellcheck actions/*/*.sh tests/actions/*.sh
