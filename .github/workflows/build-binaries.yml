name: Build Binaries

# Plain vX.Y.Z tags belong to the GitHub Actions now, so only CLI tags build.
# Tags pushed by release.yml use GITHUB_TOKEN, which doesn't trigger other
# workflows; release.yml calls this one directly instead.
on:
  push:
    tags:
      - "changesetter@v[0-9]+.[0-9]+.[0-9]+"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      # Releases are created as not-latest and promoted once their binaries
      # are attached, so the releases page never shows one with nothing to
      # download.
      make-latest:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: CLI release tag to build, e.g. changesetter@v0.3.2
        required: true
        type: string
      make-latest:
        description: Mark the release as latest once binaries are attached
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../changesetter-${{ matrix.target }}.tar.gz changesetter
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../changesetter-${{ matrix.target }}.zip changesetter.exe
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: changesetter-${{ matrix.target }}
          path: changesetter-${{ matrix.target }}.*

  publish-crates-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check crates.io
        id: published
        # A manual re-run for a tag must not fail just because the crate
        # version is already up.
        run: |
          VERSION=$(cargo pkgid | sed 's/.*[#@]//')
          if curl -sf -A "changesetter-ci" "https://crates.io/api/v1/crates/changesetter/${VERSION}" >/dev/null; then
            echo "changesetter ${VERSION} is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  attach-to-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            changesetter-*.tar.gz changesetter-*.zip

      - name: Mark as latest release
        if: inputs.make-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --latest
