name: Release

on:
  push:
    branches: [main]

concurrency:
  group: changesetter-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release
        id: release
        run: |
          OUTPUT=$(./target/release/changesetter release --output json) || EXIT_CODE=$?

          if [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "changesetter release failed with exit code ${EXIT_CODE}" >&2
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$OUTPUT" ] || ! echo "$OUTPUT" | jq -e '.releases' > /dev/null 2>&1; then
            echo "No releases to create."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASES=$(echo "$OUTPUT" | jq -c '.releases')
          COUNT=$(echo "$RELEASES" | jq 'length')

          if [ "$COUNT" = "0" ]; then
            echo "No releases to create."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tags
        if: steps.release.outputs.released == 'true'
        run: |
          git push origin main --follow-tags

      - name: Create GitHub Releases
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          echo "$RELEASES" | jq -c '.[]' | while read -r release; do
            TAG=$(echo "$release" | jq -r '.tag')
            NAME=$(echo "$release" | jq -r '.name')
            VERSION=$(echo "$release" | jq -r '.version')
            CHANGELOG=$(echo "$release" | jq -r '.changelog')

            gh release create "$TAG" \
              --title "${NAME} v${VERSION}" \
              --notes "$CHANGELOG" \
              --verify-tag || true
          done
