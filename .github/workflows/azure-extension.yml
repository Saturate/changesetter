name: Azure extension

on:
  pull_request:
    paths:
      - "extensions/azure-pipelines/**"
      - ".github/workflows/azure-extension.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release task scenarios
        working-directory: extensions/azure-pipelines/tasks/ChangsetterRelease
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          npm test
