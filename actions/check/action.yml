name: Changeset Check
description: Verify that a changeset exists for this PR

inputs:
  base:
    description: Base branch to compare against (default auto-detect from PR)
    required: false
  comment:
    description: Whether to post/update a PR comment with changeset summary
    required: false
    default: "true"
  version:
    description: changesetter version to install
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Install changesetter
      uses: saturate/changesetter/actions/install@v1
      with:
        version: ${{ inputs.version }}

    - name: Determine base
      id: base
      shell: bash
      run: |
        if [ -n "${{ inputs.base }}" ]; then
          echo "ref=${{ inputs.base }}" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ github.event.pull_request.base.ref }}" ]; then
          echo "ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=origin/main" >> "$GITHUB_OUTPUT"
        fi

    - name: Run changeset check
      id: check
      shell: bash
      run: |
        OUTPUT=$(changesetter check --base "${{ steps.base.outputs.ref }}" 2>&1) || EXIT_CODE=$?
        echo "$OUTPUT" >&2
        echo "output<<EOF" >> "$GITHUB_OUTPUT"
        echo "$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"
        echo "exit_code=${EXIT_CODE:-0}" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        CHECK_OUTPUT: ${{ steps.check.outputs.output }}
        CHECK_EXIT_CODE: ${{ steps.check.outputs.exit_code }}
      with:
        script: |
          const marker = '<!-- changesetter-check -->';
          const exitCode = parseInt(process.env.CHECK_EXIT_CODE);
          const output = process.env.CHECK_OUTPUT;

          let body;
          if (exitCode === 0) {
            body = `${marker}\n### Changeset Check: Passed\n\n\`\`\`\n${output}\n\`\`\``;
          } else {
            body = `${marker}\n### Changeset Check: Missing\n\nNo changeset found for this PR. Run \`changesetter add\` to create one.\n\n\`\`\`\n${output}\n\`\`\``;
          }

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Fail if no changeset
      if: steps.check.outputs.exit_code != '0'
      shell: bash
      run: exit 1
