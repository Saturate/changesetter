name: Install changesetter
description: Download and cache the changesetter CLI binary

inputs:
  version:
    description: Version to install (e.g. "0.1.0" or "latest")
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Determine version
      id: version
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          TAG=$(curl -s https://api.github.com/repos/saturate/changesetter/releases/latest | jq -r '.tag_name // empty')
          # Handle both v0.2.0 and changesetter@v0.2.0 tag formats
          VERSION=$(echo "$TAG" | sed 's/.*v//')
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Determine platform
      id: platform
      shell: bash
      run: |
        OS=$(uname -s | tr '[:upper:]' '[:lower:]')
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="x86_64" ;;
          aarch64|arm64) ARCH="aarch64" ;;
        esac
        case "$OS" in
          linux) TARGET="${ARCH}-unknown-linux-gnu" ;;
          darwin) TARGET="${ARCH}-apple-darwin" ;;
          *) echo "Unsupported OS: $OS"; exit 1 ;;
        esac
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"

    - name: Cache changesetter
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.changesetter/bin
        key: changesetter-${{ steps.version.outputs.version }}-${{ steps.platform.outputs.target }}

    - name: Download changesetter
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        TARGET="${{ steps.platform.outputs.target }}"
        mkdir -p ~/.changesetter/bin
        # Try v{version} tag first, fall back to changesetter@v{version}
        URL="https://github.com/saturate/changesetter/releases/download/v${VERSION}/changesetter-${TARGET}.tar.gz"
        if ! curl -sfL "$URL" | tar xz -C ~/.changesetter/bin 2>/dev/null; then
          URL="https://github.com/saturate/changesetter/releases/download/changesetter%40v${VERSION}/changesetter-${TARGET}.tar.gz"
          curl -sfL "$URL" | tar xz -C ~/.changesetter/bin
        fi

    - name: Add to PATH
      shell: bash
      run: echo "$HOME/.changesetter/bin" >> "$GITHUB_PATH"
