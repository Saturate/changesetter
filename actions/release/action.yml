name: Changesetter Release
description: Run changesetter release and optionally create GitHub Releases or Version PRs

inputs:
  github-release:
    description: Whether to create GitHub Releases
    required: false
    default: "true"
  draft:
    description: Create GitHub Releases as drafts
    required: false
    default: "false"
  version-pr:
    description: Create/update a Version Packages PR instead of releasing directly
    required: false
    default: "false"
  version-pr-title:
    description: Title for the version PR
    required: false
    default: "Version Packages"
  version:
    description: changesetter version to install
    required: false
    default: latest

outputs:
  released:
    description: Whether any releases were created
    value: ${{ steps.direct-release.outputs.released || steps.merged-release.outputs.released || 'false' }}
  releases:
    description: JSON array of release objects
    value: ${{ steps.direct-release.outputs.releases || steps.merged-release.outputs.releases || '[]' }}
  version-pr:
    description: URL of the version PR if created/updated
    value: ${{ steps.version-pr.outputs.pr-url || '' }}

runs:
  using: composite
  steps:
    - name: Install changesetter
      uses: saturate/changesetter/actions/install@v1
      with:
        version: ${{ inputs.version }}

    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # Direct release mode (version-pr: false)
    - name: Direct release
      id: direct-release
      if: inputs.version-pr == 'false'
      shell: bash
      run: |
        OUTPUT=$(changesetter release --output json) || EXIT_CODE=$?

        if [ "${EXIT_CODE:-0}" -ne 0 ]; then
          echo "changesetter release failed with exit code ${EXIT_CODE}" >&2
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$OUTPUT" ] || ! echo "$OUTPUT" | jq -e '.releases' > /dev/null 2>&1; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RELEASES=$(echo "$OUTPUT" | jq -c '.releases')
        COUNT=$(echo "$RELEASES" | jq 'length')

        if [ "$COUNT" = "0" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

    - name: Push tags (direct)
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true'
      shell: bash
      run: git push --tags

    - name: Create GitHub Releases (direct)
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true' && inputs.github-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASES: ${{ steps.direct-release.outputs.releases }}
      run: |
        DRAFT_FLAG=""
        if [ "${{ inputs.draft }}" = "true" ]; then
          DRAFT_FLAG="--draft"
        fi

        echo "$RELEASES" | jq -c '.[]' | while read -r release; do
          TAG=$(echo "$release" | jq -r '.tag')
          NAME=$(echo "$release" | jq -r '.name')
          VERSION=$(echo "$release" | jq -r '.version')
          CHANGELOG=$(echo "$release" | jq -r '.changelog')

          gh release create "$TAG" \
            --title "${NAME} v${VERSION}" \
            --notes "$CHANGELOG" \
            $DRAFT_FLAG \
            --verify-tag || true
        done

    # Version PR mode (version-pr: true)
    - name: Check for merged version PR
      id: check-merged
      if: inputs.version-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        MERGED_PR=$(gh pr list \
          --state merged \
          --label "changesetter:version" \
          --json number,mergedAt,headRefName \
          --jq '.[0] // empty' 2>/dev/null || true)

        if [ -n "$MERGED_PR" ]; then
          echo "merged=true" >> "$GITHUB_OUTPUT"
        else
          echo "merged=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Release after version PR merge
      id: merged-release
      if: inputs.version-pr == 'true' && steps.check-merged.outputs.merged == 'true'
      shell: bash
      run: |
        if ls .changeset/*.md 1>/dev/null 2>&1; then
          echo "Changesets still present, not a version PR merge."
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        OUTPUT=$(changesetter release --output json) || EXIT_CODE=$?

        if [ "${EXIT_CODE:-0}" -ne 0 ] || [ -z "$OUTPUT" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if ! echo "$OUTPUT" | jq -e '.releases' > /dev/null 2>&1; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RELEASES=$(echo "$OUTPUT" | jq -c '.releases')
        COUNT=$(echo "$RELEASES" | jq 'length')

        if [ "$COUNT" = "0" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

    - name: Push tags (version PR)
      if: inputs.version-pr == 'true' && steps.merged-release.outputs.released == 'true'
      shell: bash
      run: git push --tags

    - name: Create GitHub Releases (version PR)
      if: inputs.version-pr == 'true' && steps.merged-release.outputs.released == 'true' && inputs.github-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASES: ${{ steps.merged-release.outputs.releases }}
      run: |
        DRAFT_FLAG=""
        if [ "${{ inputs.draft }}" = "true" ]; then
          DRAFT_FLAG="--draft"
        fi

        echo "$RELEASES" | jq -c '.[]' | while read -r release; do
          TAG=$(echo "$release" | jq -r '.tag')
          NAME=$(echo "$release" | jq -r '.name')
          VERSION=$(echo "$release" | jq -r '.version')
          CHANGELOG=$(echo "$release" | jq -r '.changelog')

          gh release create "$TAG" \
            --title "${NAME} v${VERSION}" \
            --notes "$CHANGELOG" \
            $DRAFT_FLAG \
            --verify-tag || true
        done

    - name: Check for pending changesets
      id: check-pending
      if: inputs.version-pr == 'true' && steps.check-merged.outputs.merged == 'false'
      shell: bash
      run: |
        if ls .changeset/*.md 1>/dev/null 2>&1; then
          COUNT=$(ls .changeset/*.md 2>/dev/null | wc -l)
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT pending changeset(s)"
        else
          echo "pending=false" >> "$GITHUB_OUTPUT"
          echo "No pending changesets"
        fi

    - name: Create/update version PR
      id: version-pr
      if: inputs.version-pr == 'true' && steps.check-pending.outputs.pending == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_TITLE: ${{ inputs.version-pr-title }}
      run: |
        BRANCH="changesetter/version-packages"
        LABEL="changesetter:version"

        # Compute what would change
        STATUS=$(changesetter status 2>&1 || true)

        # Create or reset the version branch
        git checkout -B "$BRANCH"

        # Run version (no commit, we'll commit ourselves)
        changesetter version --no-commit || true

        # Stage and commit
        git add -A
        git commit -m "chore: version packages" --allow-empty

        # Force push the version branch
        git push origin "$BRANCH" --force

        # Go back to the original branch
        git checkout -

        # Ensure label exists
        gh label create "$LABEL" --description "Changesetter version PR" --color "6e40c9" 2>/dev/null || true

        # Check for existing PR
        EXISTING_PR=$(gh pr list \
          --head "$BRANCH" \
          --state open \
          --json number \
          --jq '.[0].number // empty' 2>/dev/null || true)

        PR_BODY="This PR was opened by changesetter. Merging it will release the following packages.

---

\`\`\`
${STATUS}
\`\`\`"

        if [ -n "$EXISTING_PR" ]; then
          gh pr edit "$EXISTING_PR" --body "$PR_BODY"
          PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          echo "Updated existing PR #${EXISTING_PR}"
        else
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "$LABEL")
          echo "Created new PR: $PR_URL"
        fi

        echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
