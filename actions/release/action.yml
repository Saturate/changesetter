name: Changesetter Release
description: Run changesetter release and optionally create GitHub Releases or Version PRs

inputs:
  github-release:
    description: Whether to create GitHub Releases
    required: false
    default: "true"
  draft:
    description: Create GitHub Releases as drafts
    required: false
    default: "false"
  version-pr:
    description: Create/update a Version Packages PR instead of releasing directly
    required: false
    default: "false"
  version-pr-title:
    description: Title for the version PR
    required: false
    default: "Version Packages"
  token:
    description: GitHub token for creating releases and PRs. Pass a GitHub App token or PAT for repos with branch protection.
    required: false
    default: ${{ github.token }}
  version:
    description: changesetter version to install
    required: false
    default: latest

outputs:
  released:
    description: Whether any releases were created
    value: ${{ steps.direct-release.outputs.released || steps.version-pr.outputs.released || 'false' }}
  releases:
    description: JSON array of release objects
    value: ${{ steps.direct-release.outputs.releases || steps.version-pr.outputs.releases || '[]' }}
  version-pr:
    description: URL of the version PR if created/updated
    value: ${{ steps.version-pr.outputs.pr-url || '' }}
  commit:
    description: Version-PR mode only, the merge commit the released tags are on. After finishing an earlier merge's release, the action checks it out, so later steps build what was tagged.
    value: ${{ steps.version-pr.outputs.commit || '' }}

runs:
  using: composite
  steps:
    - name: Install changesetter
      uses: saturate/changesetter/actions/install@v1
      with:
        version: ${{ inputs.version }}

    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # Direct release mode (version-pr: false)
    - name: Direct release
      id: direct-release
      if: inputs.version-pr == 'false'
      shell: bash
      run: |
        # "Nothing to release" exits 0, so a failure here is real (a dirty
        # tree, a bad changeset, a failing hook) and must fail the job.
        OUTPUT=$(changesetter release --output json)

        if [ -z "$OUTPUT" ] || ! echo "$OUTPUT" | jq -e '.releases' > /dev/null 2>&1; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RELEASES=$(echo "$OUTPUT" | jq -c '.releases')
        COUNT=$(echo "$RELEASES" | jq 'length')

        if [ "$COUNT" = "0" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

    - name: Push release commit and tags (direct)
      id: push-direct
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true'
      shell: bash
      # `changesetter release` commits the bump and removes the consumed
      # changesets. Pushing only the tags left that commit on no branch, so
      # the next run released the same changesets again. --atomic covers the
      # same failure when the branch moved since checkout: the branch update
      # is rejected, and the tags must not land without it.
      run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

    - name: Create GitHub Releases (direct)
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true' && inputs.github-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASES: ${{ steps.direct-release.outputs.releases }}
        DRAFT: ${{ inputs.draft }}
      run: |
        while read -r release; do
          TAG=$(jq -r '.tag' <<<"$release")
          NAME=$(jq -r '.name' <<<"$release")
          VERSION=$(jq -r '.version' <<<"$release")
          CHANGELOG=$(jq -r '.changelog' <<<"$release")

          # `[tag] skip` packages are versioned but get no tag to release.
          if [ "$TAG" = "null" ]; then
            continue
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists"
            continue
          fi

          FLAGS=()
          if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
          gh release create "$TAG" \
            --title "${NAME:+${NAME} }v${VERSION}" \
            --notes "$CHANGELOG" \
            "${FLAGS[@]}" \
            --verify-tag
        done < <(jq -c '.[]' <<<"$RELEASES")

    # Version PR mode (version-pr: true). The CLI does the whole loop: it
    # finds the version PR this commit merged (or the last one, if its run
    # never finished), tags what it released, creates the GitHub Releases,
    # then opens or updates the version PR for pending changesets.
    - name: Version PR
      id: version-pr
      if: inputs.version-pr == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.version-pr-title }}
        GITHUB_RELEASE: ${{ inputs.github-release }}
        DRAFT: ${{ inputs.draft }}
      run: |
        if ! changesetter version-pr --help > /dev/null 2>&1; then
          echo "::error::Version PR mode needs changesetter 0.9.0 or newer (changesetter version-pr)"
          exit 1
        fi

        FLAGS=(--provider github --base "$GITHUB_REF_NAME" --title "$PR_TITLE" --output json)
        if [ "$GITHUB_RELEASE" != "true" ]; then FLAGS+=(--no-github-release); fi
        if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
        OUT=$(changesetter version-pr "${FLAGS[@]}")

        # `released` lists only what this run tagged or published, so a
        # re-run doesn't re-trigger publish steps gated on it.
        RELEASES=$(jq -c '.released' <<<"$OUT")
        COMMIT=$(jq -r '.commit // empty' <<<"$OUT")
        if [ "$RELEASES" = "[]" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
        else
          # Finishing an earlier merge's release: the checkout is a newer
          # commit with the same version numbers, and publish steps gated on
          # `released` would ship its unreleased code under those versions.
          if [ "$(jq -r '.recovered' <<<"$OUT")" = "true" ]; then
            git checkout --quiet --detach "$COMMIT"
            echo "::notice::Released the tags on ${COMMIT}, the version PR merge an earlier run didn't finish, and checked it out for the steps after this one."
          fi
          {
            echo "released=true"
            echo "releases=${RELEASES}"
            echo "version=$(jq -r '.[0].version' <<<"$RELEASES")"
          } >> "$GITHUB_OUTPUT"
        fi
        echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
        echo "pr-url=$(jq -r '.version_pr.url // empty' <<<"$OUT")" >> "$GITHUB_OUTPUT"
