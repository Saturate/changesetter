name: Changesetter Release
description: Run changesetter release and optionally create GitHub Releases or Version PRs

inputs:
  github-release:
    description: Whether to create GitHub Releases
    required: false
    default: "true"
  draft:
    description: Create GitHub Releases as drafts
    required: false
    default: "false"
  version-pr:
    description: Create/update a Version Packages PR instead of releasing directly
    required: false
    default: "false"
  version-pr-title:
    description: Title for the version PR
    required: false
    default: "Version Packages"
  token:
    description: GitHub token for creating releases and PRs. Pass a GitHub App token or PAT for repos with branch protection.
    required: false
    default: ${{ github.token }}
  version:
    description: changesetter version to install
    required: false
    default: latest

outputs:
  released:
    description: Whether any releases were created
    value: ${{ steps.direct-release.outputs.released || steps.merged-release.outputs.released || 'false' }}
  releases:
    description: JSON array of release objects
    value: ${{ steps.direct-release.outputs.releases || steps.merged-release.outputs.releases || '[]' }}
  version-pr:
    description: URL of the version PR if created/updated
    value: ${{ steps.version-pr.outputs.pr-url || '' }}

runs:
  using: composite
  steps:
    - name: Install changesetter
      uses: saturate/changesetter/actions/install@v1
      with:
        version: ${{ inputs.version }}

    - name: Configure git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # Direct release mode (version-pr: false)
    - name: Direct release
      id: direct-release
      if: inputs.version-pr == 'false'
      shell: bash
      run: |
        OUTPUT=$(changesetter release --output json) || EXIT_CODE=$?

        if [ "${EXIT_CODE:-0}" -ne 0 ]; then
          echo "changesetter release failed with exit code ${EXIT_CODE}" >&2
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$OUTPUT" ] || ! echo "$OUTPUT" | jq -e '.releases' > /dev/null 2>&1; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        RELEASES=$(echo "$OUTPUT" | jq -c '.releases')
        COUNT=$(echo "$RELEASES" | jq 'length')

        if [ "$COUNT" = "0" ]; then
          echo "released=false" >> "$GITHUB_OUTPUT"
          echo "releases=[]" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"

    - name: Push tags (direct)
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true'
      shell: bash
      run: git push --tags

    - name: Create GitHub Releases (direct)
      if: inputs.version-pr == 'false' && steps.direct-release.outputs.released == 'true' && inputs.github-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASES: ${{ steps.direct-release.outputs.releases }}
      run: |
        DRAFT_FLAG=""
        if [ "${{ inputs.draft }}" = "true" ]; then
          DRAFT_FLAG="--draft"
        fi

        echo "$RELEASES" | jq -c '.[]' | while read -r release; do
          TAG=$(echo "$release" | jq -r '.tag')
          NAME=$(echo "$release" | jq -r '.name')
          VERSION=$(echo "$release" | jq -r '.version')
          CHANGELOG=$(echo "$release" | jq -r '.changelog')

          gh release create "$TAG" \
            --title "${NAME} v${VERSION}" \
            --notes "$CHANGELOG" \
            $DRAFT_FLAG \
            --verify-tag || true
        done

    # Version PR mode (version-pr: true)
    - name: Check for merged version PR
      id: check-merged
      if: inputs.version-pr == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # Ask for the PRs associated with HEAD rather than searching merged
        # PRs: `gh pr list --label` goes through the search index, which can
        # lag right after the merge and would silently skip the release.
        # No error swallowing either, since a failed lookup would look
        # exactly like "not a version PR" and also skip the release.
        HEAD_SHA=$(git rev-parse HEAD)
        MERGED_PR=$(gh api "repos/{owner}/{repo}/commits/${HEAD_SHA}/pulls" \
          --jq "[.[] | select(.merge_commit_sha == \"${HEAD_SHA}\" and any(.labels[]; .name == \"changesetter:version\")) | .number] | first // empty")

        if [ -n "$MERGED_PR" ]; then
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "HEAD commit is version PR #${MERGED_PR} merge"
        else
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "HEAD commit is not a version PR merge"
        fi

    - name: Release after version PR merge
      id: merged-release
      if: inputs.version-pr == 'true' && steps.check-merged.outputs.merged == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        # The version PR already bumped the manifest, so it holds the version
        # being released. Not `changesetter status`: changesets merged while
        # the version PR was open would make it report the wrong package's
        # version, and its X.Y.Z grep drops pre-release suffixes.
        VERSION=$(grep -E '^version[[:space:]]*=[[:space:]]*"' Cargo.toml 2>/dev/null | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
        if [ -z "$VERSION" ]; then
          VERSION=$(jq -r '.version // empty' package.json 2>/dev/null || true)
        fi

        if [ -z "$VERSION" ]; then
          echo "Could not determine version after version PR merge"
          echo "released=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        TAG="v${VERSION}"

        CHANGELOG=$("${GITHUB_ACTION_PATH}/release-notes.sh" "$VERSION")

        # Create tag
        git tag -a "$TAG" -m "${CHANGELOG:-Release ${VERSION}}" --cleanup=verbatim
        git push origin "$TAG"

        # Create GitHub Release
        gh release create "$TAG" \
          --title "$TAG" \
          --notes "${CHANGELOG:-Release ${VERSION}}" \
          || true

        # Build release JSON for outputs
        RELEASES=$(jq -nc "[{\"name\":\"$(basename $(pwd))\",\"version\":\"${VERSION}\",\"tag\":\"${TAG}\",\"changelog\":$(echo "$CHANGELOG" | jq -Rs .)}]")

        echo "released=true" >> "$GITHUB_OUTPUT"
        echo "releases=$RELEASES" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Push tags (version PR)
      if: inputs.version-pr == 'true' && steps.merged-release.outputs.released == 'true'
      shell: bash
      run: git push --tags

    - name: Create GitHub Releases (version PR)
      if: inputs.version-pr == 'true' && steps.merged-release.outputs.released == 'true' && inputs.github-release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASES: ${{ steps.merged-release.outputs.releases }}
      run: |
        DRAFT_FLAG=""
        if [ "${{ inputs.draft }}" = "true" ]; then
          DRAFT_FLAG="--draft"
        fi

        echo "$RELEASES" | jq -c '.[]' | while read -r release; do
          TAG=$(echo "$release" | jq -r '.tag')
          NAME=$(echo "$release" | jq -r '.name')
          VERSION=$(echo "$release" | jq -r '.version')
          CHANGELOG=$(echo "$release" | jq -r '.changelog')

          gh release create "$TAG" \
            --title "${NAME} v${VERSION}" \
            --notes "$CHANGELOG" \
            $DRAFT_FLAG \
            --verify-tag || true
        done

    - name: Check for pending changesets
      id: check-pending
      # Also after a release: changesets merged while the version PR was open
      # are still in the tree and need a fresh version PR.
      if: inputs.version-pr == 'true'
      shell: bash
      run: |
        if ls .changeset/*.md 1>/dev/null 2>&1; then
          COUNT=$(ls .changeset/*.md 2>/dev/null | wc -l)
          echo "pending=true" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT pending changeset(s)"
        else
          echo "pending=false" >> "$GITHUB_OUTPUT"
          echo "No pending changesets"
        fi

    - name: Create/update version PR
      id: version-pr
      if: inputs.version-pr == 'true' && steps.check-pending.outputs.pending == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.version-pr-title }}
      run: |
        BRANCH="changesetter/version-packages"
        LABEL="changesetter:version"

        # Compute what would change
        STATUS=$(changesetter status 2>&1 || true)

        # Create or reset the version branch
        git checkout -B "$BRANCH"

        # No commit, we'll commit ourselves. A failure here (say a post_bump
        # hook) must stop the job: the tree is half bumped, and pushing it
        # would open a version PR that releases nothing when merged.
        changesetter version --no-commit

        # Extract the changelog diff (new entries added by version)
        CHANGELOG_DIFF=$(git diff -- CHANGELOG.md | grep "^+" | grep -v "^+++" | sed 's/^+//' || true)

        # Stage and commit
        git add -A
        git commit -m "chore: version packages" --allow-empty

        # Force push the version branch
        git push origin "$BRANCH" --force

        # Go back to the original branch
        git checkout -

        # Ensure label exists
        gh label create "$LABEL" --description "Changesetter version PR" --color "6e40c9" 2>/dev/null || true

        # Check for existing PR
        EXISTING_PR=$(gh pr list \
          --head "$BRANCH" \
          --state open \
          --json number \
          --jq '.[0].number // empty' 2>/dev/null || true)

        PR_BODY=$(cat <<PREOF
        This PR was opened by [changesetter](https://github.com/Saturate/changesetter). Merging it will release the following packages.

        ${STATUS}

        ## Changelog preview

        ${CHANGELOG_DIFF}
        PREOF
        )

        if [ -n "$EXISTING_PR" ]; then
          gh pr edit "$EXISTING_PR" --body "$PR_BODY"
          PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq '.url')
          echo "Updated existing PR #${EXISTING_PR}"
        else
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --label "$LABEL")
          echo "Created new PR: $PR_URL"
        fi

        echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"
